[project]
name = "toolcall-sft"
version = "0.1.0"
description = "LoRA fine-tuning of small local LLMs on multi-turn tool-calling dialogues"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sergei Shkarin" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "fine-tuning", "lora", "peft", "sft", "tool-calling", "function-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
tcsft = "toolcall_sft.cli:main"
tcsft-train = "toolcall_sft.train_cli:main"

[dependency-groups]
train = [
    "accelerate>=1.3",
    "datasets>=3.2",
    "peft>=0.14",
    "torch>=2.6",
    "transformers>=4.56,<5",
]
# Experiment tracking is opt-in: see tracking.report_to in the experiment config.
tracking = [
    "mlflow>=3.1",
]
# The whole test suite runs without torch — the root package is deliberately free
# of it, and template behaviour is tested against small purpose-built tokenizers.
# jinja2 is what transformers renders chat templates with.
test = [
    "jinja2>=3.1",
    "pytest>=8.3",
    "transformers>=4.56,<5",
]
# CUDA-only accelerators: 4-bit base weights (QLoRA) and fused cross-entropy.
cuda = [
    "bitsandbytes>=0.45 ; sys_platform == 'linux'",
    "liger-kernel>=0.5.10 ; sys_platform == 'linux'",
]
dev = [
    { include-group = "train" },
    { include-group = "tracking" },
    { include-group = "test" },
    "pyright>=1.1.390",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolcall_sft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["training: end-to-end training smoke test; needs torch, skipped without it"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["toolcall_sft"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUntypedFunctionDecorator = false
