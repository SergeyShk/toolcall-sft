# Qwen3-0.6B + LoRA on a laptop (Apple Silicon). `device: auto` also picks CUDA or CPU.
run_name: payments-qwen3-0.6b-lora
base_model: Qwen/Qwen3-0.6B
output_dir: outputs/payments-qwen3-0.6b-lora

dataset:
  train_path: data/train.jsonl
  eval_path: data/eval.jsonl
  max_seq_length: 2048          # per example; the last turn of a dialogue is the longest (`tcsft stats --config`)
  chat_template_kwargs:
    enable_thinking: false      # Qwen3 non-thinking mode; serve with the same flag

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  epochs: 2
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  eval_batch_size: 1            # eval logits span a 150k vocabulary; keep this small on MPS
  gradient_accumulation_steps: 8
  device: auto                  # cuda -> mps -> cpu
  precision: auto               # bf16 on an accelerator, fp32 on cpu
  gradient_checkpointing: true  # keep on for MPS: the allocator overcommits and swaps instead of failing
  seed: 42
