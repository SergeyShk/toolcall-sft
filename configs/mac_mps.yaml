# Laptop-scale run: Qwen3-1.7B + LoRA on Apple Silicon (MPS).
# ~3.5 GB of bf16 base weights plus fp32 adapters — comfortable on 16 GB of
# unified memory. `device: auto` also picks up CUDA or falls back to CPU, so
# this config is a working default everywhere; it is simply tuned for a laptop.
run_name: payments-qwen3-1.7b-lora
base_model: Qwen/Qwen3-1.7B
output_dir: outputs/payments-qwen3-1.7b-lora

dataset:
  train_path: data/train.jsonl
  eval_path: data/eval.jsonl
  max_seq_length: 2048

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  epochs: 2
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  device: auto      # cuda -> mps -> cpu
  precision: auto   # bf16 on an accelerator, fp32 on cpu
  # Keep this on for MPS. PyTorch's MPS allocator is allowed to reserve well past
  # physical memory (1.7x the recommended maximum by default) and will not give it
  # back, so without checkpointing a 1.7B run on a 36 GB machine grows to a 42 GB
  # footprint, the machine swaps, and step time degrades from 20s to 200s+ instead
  # of failing outright. Measured, not theoretical.
  gradient_checkpointing: true
  seed: 42
